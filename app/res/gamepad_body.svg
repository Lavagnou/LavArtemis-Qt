<?xml version="1.0" encoding="UTF-8"?>
<!--
  Schematic gamepad body used as the backdrop of the mapping diagram.
  The controls themselves are drawn in QML on top of this, so that they can be
  clicked, coloured by binding state and animated from live input.

  The app forces the Material Dark theme, so the palette is fixed rather than
  theme-aware.
-->
